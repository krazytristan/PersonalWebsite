<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="libBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140d1a" />
      <stop offset="50%" stop-color="#24142e" />
      <stop offset="100%" stop-color="#0e0a14" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>
    <filter id="roseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#libBgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="80" y1="0" x2="80" y2="500" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="240" y1="0" x2="240" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="560" y1="0" x2="560" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
    <line x1="720" y1="0" x2="720" y2="500" />
  </g>

  <!-- Glows -->
  <circle cx="200" cy="240" r="160" fill="#F43F5E" opacity="0.14" filter="url(#roseGlow)" />
  <circle cx="640" cy="200" r="180" fill="#EC4899" opacity="0.1" filter="url(#roseGlow)" />

  <!-- Main Window -->
  <rect x="50" y="40" width="700" height="420" rx="16" fill="#181120" stroke="#331e42" stroke-width="1.5" />

  <!-- Header -->
  <rect x="50" y="40" width="700" height="44" rx="16" fill="#22162e" />
  <circle cx="75" cy="62" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="95" cy="62" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="115" cy="62" r="6" fill="#10B981" opacity="0.8" />

  <text x="400" y="66" fill="#D8B4FE" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle" letter-spacing="1">
    LibrarySys • Barcode Attendance & Automated Circulation
  </text>

  <!-- Left: Barcode Scanner Module -->
  <rect x="70" y="98" width="310" height="210" rx="12" fill="#20152b" stroke="#38214b" stroke-width="1" />
  <text x="90" y="126" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">Optical Barcode Reader</text>
  <text x="360" y="126" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">Laser Active</text>

  <!-- Barcode Visual -->
  <g transform="translate(100, 145)">
    <rect width="250" height="80" rx="8" fill="#FFFFFF" />
    <!-- Barcode bars -->
    <g fill="#0F172A">
      <rect x="20" y="15" width="4" height="45" />
      <rect x="28" y="15" width="2" height="45" />
      <rect x="34" y="15" width="6" height="45" />
      <rect x="44" y="15" width="3" height="45" />
      <rect x="52" y="15" width="5" height="45" />
      <rect x="62" y="15" width="2" height="45" />
      <rect x="68" y="15" width="7" height="45" />
      <rect x="80" y="15" width="3" height="45" />
      <rect x="88" y="15" width="2" height="45" />
      <rect x="94" y="15" width="6" height="45" />
      <rect x="105" y="15" width="4" height="45" />
      <rect x="114" y="15" width="2" height="45" />
      <rect x="122" y="15" width="8" height="45" />
      <rect x="135" y="15" width="3" height="45" />
      <rect x="142" y="15" width="2" height="45" />
      <rect x="150" y="15" width="5" height="45" />
      <rect x="160" y="15" width="4" height="45" />
      <rect x="170" y="15" width="2" height="45" />
      <rect x="176" y="15" width="7" height="45" />
      <rect x="188" y="15" width="3" height="45" />
      <rect x="196" y="15" width="5" height="45" />
      <rect x="206" y="15" width="2" height="45" />
      <rect x="214" y="15" width="6" height="45" />
      <rect x="224" y="15" width="3" height="45" />
    </g>
    <!-- Red Laser Beam -->
    <line x1="10" y1="38" x2="240" y2="38" stroke="#EF4444" stroke-width="2.5" />
    <line x1="10" y1="38" x2="240" y2="38" stroke="#F87171" stroke-width="6" opacity="0.4" />
    <text x="125" y="72" fill="#334155" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">STU-2024-99824-BSCS</text>
  </g>

  <rect x="90" y="246" width="270" height="46" rx="6" fill="#2c1a3b" stroke="#46275d" stroke-width="1" />
  <text x="104" y="265" fill="#34D399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">✓ Student Check-in Verified</text>
  <text x="104" y="280" fill="#D8B4FE" font-family="'JetBrains Mono', monospace" font-size="10">Attendance Logged • Time: 09:14:22 AM</text>

  <!-- Left Bottom: Stat Grid -->
  <g transform="translate(70, 322)">
    <rect width="145" height="120" rx="10" fill="#20152b" stroke="#38214b" stroke-width="1" />
    <text x="16" y="28" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Total Scans</text>
    <text x="16" y="60" fill="#FB7185" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700">5,840+</text>
    <text x="16" y="86" fill="#34D399" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">↑ 18% this semester</text>
  </g>
  <g transform="translate(235, 322)">
    <rect width="145" height="120" rx="10" fill="#20152b" stroke="#38214b" stroke-width="1" />
    <text x="16" y="28" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Active Catalog</text>
    <text x="16" y="60" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700">12,450</text>
    <text x="16" y="86" fill="#D8B4FE" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Indexed Titles</text>
  </g>

  <!-- Right: Circulation & Analytics Chart -->
  <rect x="400" y="98" width="330" height="344" rx="12" fill="#20152b" stroke="#38214b" stroke-width="1" />
  <text x="424" y="128" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">Weekly Circulation Traffic</text>
  <text x="690" y="128" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">Daily Avg</text>

  <!-- Chart visualization -->
  <g transform="translate(424, 160)">
    <!-- Chart axes -->
    <line x1="0" y1="120" x2="280" y2="120" stroke="#38214b" stroke-width="1" />
    <line x1="0" y1="80" x2="280" y2="80" stroke="#2c1a3b" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="40" x2="280" y2="40" stroke="#2c1a3b" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Chart Bars -->
    <!-- Mon -->
    <rect x="18" y="45" width="22" height="75" rx="4" fill="#F43F5E" opacity="0.85" />
    <text x="29" y="136" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">MON</text>

    <!-- Tue -->
    <rect x="62" y="30" width="22" height="90" rx="4" fill="#F43F5E" opacity="0.85" />
    <text x="73" y="136" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">TUE</text>

    <!-- Wed -->
    <rect x="106" y="20" width="22" height="100" rx="4" fill="#FB7185" />
    <text x="117" y="136" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">WED</text>

    <!-- Thu -->
    <rect x="150" y="38" width="22" height="82" rx="4" fill="#F43F5E" opacity="0.85" />
    <text x="161" y="136" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">THU</text>

    <!-- Fri -->
    <rect x="194" y="55" width="22" height="65" rx="4" fill="#F43F5E" opacity="0.85" />
    <text x="205" y="136" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">FRI</text>

    <!-- Sat -->
    <rect x="238" y="80" width="22" height="40" rx="4" fill="#F43F5E" opacity="0.5" />
    <text x="249" y="136" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">SAT</text>
  </g>

  <!-- Live Transactions List -->
  <g transform="translate(424, 320)">
    <rect width="280" height="34" rx="6" fill="#291b37" />
    <circle cx="16" cy="17" r="6" fill="#10B981" />
    <text x="32" y="16" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Borrowed: Clean Code (Robert C. Martin)</text>
    <text x="32" y="27" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">Due date set • Auto reminder scheduled</text>
  </g>
  <g transform="translate(424, 362)">
    <rect width="280" height="34" rx="6" fill="#291b37" />
    <circle cx="16" cy="17" r="6" fill="#38BDF8" />
    <text x="32" y="16" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Returned: Introduction to Algorithms (CLRS)</text>
    <text x="32" y="27" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">Restocked to Shelf A-4 • Penalty: 0</text>
  </g>
</svg>
