  <g transform="translate(460, 312)">
    <rect width="250" height="42" rx="6" fill="#2d1f14" />
    <circle cx="16" cy="21" r="5" fill="#10B981" />
    <text x="30" y="18" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Angelica M. — Timed In (On-Time)</text>
    <text x="30" y="32" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">Terminal 01 • 07:59:02 AM</text>
  </g>

  <g transform="translate(460, 364)">
    <rect width="250" height="42" rx="6" fill="#2d1f14" />
    <circle cx="16" cy="21" r="5" fill="#F59E0B" />
    <text x="30" y="18" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Joshua T. — Verified Grace Period</text>
    <text x="30" y="32" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">Terminal 03 • 08:04:18 AM</text>
