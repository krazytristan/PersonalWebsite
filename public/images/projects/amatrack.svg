    <rect x="8" y="8" width="4" height="38" rx="2" fill="#A855F7" />
    <text x="24" y="24" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">CPE 401: Embedded Systems & IoT</text>
    <text x="24" y="40" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Hardware Lab • 01:00 - 04:00 PM</text>
