    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="80" y1="0" x2="80" y2="500" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="240" y1="0" x2="240" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="560" y1="0" x2="560" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
    <line x1="720" y1="0" x2="720" y2="500" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="220" cy="220" r="180" fill="#10B981" opacity="0.12" filter="url(#emeraldGlow)" />
  <circle cx="620" cy="280" r="160" fill="#14B8A6" opacity="0.1" filter="url(#emeraldGlow)" />

  <!-- Main Window -->
  <rect x="50" y="40" width="700" height="420" rx="16" fill="#0d1b22" stroke="#1b343f" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="50" y="40" width="700" height="44" rx="16" fill="#12252e" />
  <circle cx="75" cy="62" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="95" cy="62" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="115" cy="62" r="6" fill="#10B981" opacity="0.8" />

  <text x="400" y="66" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle" letter-spacing="1">
    Barangay Cloud ERP • Resident Management & E-Certificates
  </text>

  <!-- Left Stats & Citizen Registry -->
  <rect x="70" y="98" width="310" height="150" rx="12" fill="#12242c" stroke="#1f3c49" stroke-width="1" />
