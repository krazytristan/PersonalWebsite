    <text x="12" y="22" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Residents</text>
    <text x="12" y="42" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">4,280</text>
  </g>
  <g transform="translate(182, 142)">
    <rect width="84" height="50" rx="6" fill="#18313c" />
    <text x="12" y="22" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Issued Certs</text>
    <text x="12" y="42" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">1,120+</text>
  </g>
  <g transform="translate(274, 142)">
    <rect width="84" height="50" rx="6" fill="#18313c" />
    <text x="12" y="22" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Queued</text>
    <text x="12" y="42" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">3</text>
  </g>

  <rect x="90" y="206" width="270" height="24" rx="6" fill="#10B981" opacity="0.15" />
  <text x="102" y="222" fill="#34D399" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">✓ Automated PDF & Email pipeline healthy</text>

  <!-- Right: Digital Certificate Preview Document -->
  <rect x="400" y="98" width="330" height="344" rx="12" fill="#12252f" stroke="#1f3c49" stroke-width="1" />
  
  <!-- Mini Certificate Card inside -->
  <rect x="420" y="118" width="290" height="220" rx="8" fill="#F8FAFC" />
  <!-- Certificate Header Seal -->
  <circle cx="452" cy="148" r="16" fill="#10B981" opacity="0.2" />
  <circle cx="452" cy="148" r="11" fill="#10B981" />
  <text x="478" y="145" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11">OFFICE OF THE BARANGAY COUNCIL</text>
  <text x="478" y="157" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">BARANGAY CLEARANCE CERTIFICATE</text>

  <line x1="436" y1="172" x2="694" y2="172" stroke="#E2E8F0" stroke-width="1.5" />

  <text x="436" y="192" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">TO WHOM IT MAY CONCERN:</text>
  <text x="436" y="208" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">This is to certify that Juan Dela Cruz,</text>
  <text x="436" y="222" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">is a bonafide resident of good moral standing with no pending derogatory records.</text>

  <!-- QR & Seal -->
  <rect x="436" y="244" width="46" height="46" rx="4" fill="#0F172A" />
  <g fill="#FFFFFF" transform="translate(440, 248) scale(0.6)">
    <rect width="18" height="18" />
    <rect x="36" width="18" height="18" />
    <rect y="36" width="18" height="18" />
    <rect x="18" y="18" width="18" height="18" />
    <rect x="36" y="36" width="18" height="18" />
  </g>
  <text x="494" y="260" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">DIGITAL QR AUTH</text>
  <text x="494" y="274" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="8">VERIFIED • ID: BGY-2025-0891</text>
  <text x="494" y="286" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">Generated instantly via Cloud Dispatcher</text>

  <!-- Delivery pipeline bottom -->
  <rect x="420" y="352" width="290" height="74" rx="8" fill="#162c37" stroke="#234555" stroke-width="1" />
  <circle cx="438" cy="374" r="5" fill="#38BDF8" />
  <text x="450" y="378" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Automated Mail Dispatcher</text>
  <text x="450" y="394" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Target: citizen@gmail.com • Sent via PHPMailer SMTP</text>
  <text x="450" y="412" fill="#34D399" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">✓ PDF Attached (312 KB) • Timestamp: 14:32:08</text>

  <!-- Left Bottom: Resident Directory -->
  <rect x="70" y="262" width="310" height="180" rx="12" fill="#12242c" stroke="#1f3c49" stroke-width="1" />
  <text x="90" y="290" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Recent Service Requests</text>

  <g transform="translate(90, 304)">
    <rect width="270" height="34" rx="6" fill="#172f3a" />
    <circle cx="16" cy="17" r="8" fill="#10B981" opacity="0.3" />
    <text x="32" y="16" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Maria Santos — Residency Cert</text>
    <text x="32" y="27" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">Generated & Dispatched in 1.4s</text>
  </g>
  <g transform="translate(90, 344)">
    <rect width="270" height="34" rx="6" fill="#172f3a" />
    <circle cx="16" cy="17" r="8" fill="#38BDF8" opacity="0.3" />
    <text x="32" y="16" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Antonio Ramos — Business Permit</text>
    <text x="32" y="27" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">Fee verified • Ready for pickup</text>
  </g>
  <g transform="translate(90, 384)">
    <rect width="270" height="34" rx="6" fill="#172f3a" />
    <circle cx="16" cy="17" r="8" fill="#FF6D1F" opacity="0.3" />
    <text x="32" y="16" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">Elena Bautista — Indigency Record</text>
    <text x="32" y="27" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">Dispatched with secure digital sign</text>
